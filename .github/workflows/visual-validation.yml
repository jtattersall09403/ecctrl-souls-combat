name: Production visual validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - "index.html"
      - "visual-review-attestation.json"
      - ".github/workflows/visual-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - "index.html"
      - "visual-review-attestation.json"
      - ".github/workflows/visual-validation.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Capture and assert every production animation scenario
        run: npm run visual:test
      - name: Require current project-owner visual review attestation
        run: npm run visual:review:attestation:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-visual-validation
          path: artifacts/visual-validation/latest
          if-no-files-found: error
          retention-days: 7
